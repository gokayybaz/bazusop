name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make test
      - run: make build
      - run: docker compose config --quiet
      - run: docker build --tag bazusop:ci .
      - run: docker run --rm -v "${{ github.workspace }}:/work" alpine/helm:3.18.6 lint /work/deploy/helm/bazusop
