name: bazusop

services:
  hub:
    build:
      context: .
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment:
      BAZUSOP_HTTP_ADDR: ":8080"
      BAZUSOP_ENROLLMENT_TOKEN: "${BAZUSOP_ENROLLMENT_TOKEN:-local-compose-token}"
      BAZUSOP_OPERATOR_TOKEN: "${BAZUSOP_OPERATOR_TOKEN:-local-operator-token}"
      BAZUSOP_ADMIN_TOKEN: "${BAZUSOP_ADMIN_TOKEN:-local-admin-token}"
      BAZUSOP_TELEMETRY_RETENTION_DAYS: "${BAZUSOP_TELEMETRY_RETENTION_DAYS:-30}"
      BAZUSOP_LOG_RETENTION_DAYS: "${BAZUSOP_LOG_RETENTION_DAYS:-14}"
      BAZUSOP_BOOTSTRAP_SECRET: "${BAZUSOP_BOOTSTRAP_SECRET:-}"
      BAZUSOP_TOTP_ENCRYPTION_KEY: "${BAZUSOP_TOTP_ENCRYPTION_KEY:-}"
      BAZUSOP_TRUSTED_ORIGINS: "${BAZUSOP_TRUSTED_ORIGINS:-}"
      DATABASE_URL: "postgres://bazusop:${POSTGRES_PASSWORD:-bazusop-dev}@postgres:5432/bazusop?sslmode=disable"
      BAZUSOP_TIMESCALE_ENABLED: "true"
    ports:
      - "${BAZUSOP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

  postgres:
    image: timescale/timescaledb:latest-pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: bazusop
      POSTGRES_USER: bazusop
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bazusop-dev}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bazusop -d bazusop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
